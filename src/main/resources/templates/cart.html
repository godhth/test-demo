<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>购物车 · WeBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
  <h1>购物车</h1>
  <div th:if="${cart == null or #lists.isEmpty(cart.items)}">
    <p>购物车是空的。</p>
    <a class="btn" th:href="@{/menu}">去逛菜单</a>
  </div>
  <div th:if="${cart != null and not #lists.isEmpty(cart.items)}">
    <table class="cart-table">
      <thead>
        <tr><th>菜品</th><th>单价</th><th>数量</th><th>小计</th><th>操作</th></tr>
      </thead>
      <tbody>
        <tr th:each="line : ${cart.items}">
          <td th:text="${line.menuItem.name}">名称</td>
          <td>¥<span th:text="${line.menuItem.price}">0.00</span></td>
          <td>
            <form th:action="@{/cart/update}" method="post" style="margin:0;display:flex;gap:6px;">
              <input type="hidden" name="menuItemId" th:value="${line.menuItem.id}"/>
              <input type="number" name="quantity" min="1" th:value="${line.quantity}" style="width:64px;"/>
              <button class="btn" type="submit">更新</button>
            </form>
          </td>
          <td>¥<span th:text="${line.subtotal}">0.00</span></td>
          <td>
            <form th:action="@{/cart/remove}" method="post" style="margin:0;">
              <input type="hidden" name="menuItemId" th:value="${line.menuItem.id}"/>
              <button class="btn btn-danger" type="submit">移除</button>
            </form>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr><td colspan="3"></td><td><strong>合计</strong></td><td>¥<span th:text="${cart.total}">0.00</span></td></tr>
      </tfoot>
    </table>
    <div class="actions">
      <a class="btn" th:href="@{/menu}">继续选购</a>
      <a class="btn btn-primary" th:href="@{/checkout}">去结算</a>
    </div>
  </div>
</main>
</body>
</html>
