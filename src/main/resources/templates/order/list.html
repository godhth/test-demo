<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的订单 · WeBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
  <h1>我的订单</h1>
  <div th:if="${#lists.isEmpty(orders)}">
    <p>暂无订单。</p>
    <a class="btn" th:href="@{/menu}">去下单</a>
  </div>
  <table class="cart-table" th:if="${not #lists.isEmpty(orders)}">
    <thead>
      <tr><th>订单号</th><th>下单时间</th><th>金额</th><th>状态</th><th>操作</th></tr>
    </thead>
    <tbody>
      <tr th:each="o : ${orders}">
        <td th:text="${o.id}">0</td>
        <td th:text="${o.createdAt}">-</td>
        <td>¥<span th:text="${o.totalAmount}">0.00</span></td>
        <td th:text="${o.status}">-</td>
        <td><a class="btn" th:href="@{|/orders/${o.id}|}">查看</a></td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
