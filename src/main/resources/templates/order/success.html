<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>下单成功 · WeBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
  <section class="success-panel">
    <h1>🎉 下单成功</h1>
    <p>订单号：<strong th:text="${order.id}">0</strong></p>
    <p>金额：¥<span th:text="${order.totalAmount}">0.00</span></p>
    <div class="actions">
      <a class="btn btn-primary" th:href="@{|/orders/${order.id}|}">查看订单详情</a>
      <a class="btn" th:href="@{/menu}">继续选购</a>
    </div>
  </section>
</main>
</body>
</html>
