<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>登录 · WeBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<main class="auth-container">
  <h1>登录</h1>
  <div class="error" th:if="${error}" th:text="${error}"></div>
  <form th:action="@{/login}" method="post" th:object="${loginForm}">
    <div class="field">
      <label for="email">邮箱</label>
      <input id="email" type="email" th:field="*{email}" required/>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" th:field="*{password}" required/>
    </div>
    <button class="btn btn-primary" type="submit">登录</button>
  </form>
  <p>还没有账号？<a th:href="@{/register}">前往注册</a></p>
</main>
</body>
</html>
