<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>注册 · WeBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<main class="auth-container">
  <h1>注册</h1>
  <div class="error" th:if="${error}" th:text="${error}"></div>
  <form th:action="@{/register}" method="post" th:object="${registerForm}">
    <div class="field">
      <label for="email">邮箱</label>
      <input id="email" type="email" th:field="*{email}" required/>
    </div>
    <div class="field">
      <label for="name">姓名</label>
      <input id="name" type="text" th:field="*{name}" required/>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" th:field="*{password}" required/>
    </div>
    <button class="btn btn-primary" type="submit">注册</button>
  </form>
  <p>已有账号？<a th:href="@{/login}">前往登录</a></p>
</main>
</body>
</html>
